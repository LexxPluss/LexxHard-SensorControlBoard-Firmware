name: release-handling
description: Parse the release tag, create or publish the Release, and re-assert Latest
inputs:
  mode:
    description: parse, release or reassert
    required: true
  tag:
    description: Pushed tag name
    required: true
  token:
    description: GitHub token with contents access
    required: true
runs:
  using: composite
  steps:
    - uses: actions/github-script@v7
      env:
        RH_MODE: ${{ inputs.mode }}
        RH_TAG: ${{ inputs.tag }}
      with:
        github-token: ${{ inputs.token }}
        script: |
          const run = require(process.env.GITHUB_WORKSPACE + '/.github/actions/release-handling/run.js');
          await run({ github, context, core, mode: process.env.RH_MODE, tag: process.env.RH_TAG });
