name: release
# Use one trigger to avoid duplicate builds for the same tag.
on:
  push:
    tags:
      - 'v*'
# Required to create releases and upload assets.
permissions:
  contents: write
jobs:
  build:
    runs-on: lp-4core-runner
    container:
      image: zephyrprojectrtos/zephyr-build:v0.26.9
      options: --user root
    env:
      SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Extract version from tag
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_ENV
      - name: build
        id: build
        run: |
          set -e
          cp -a /home/user/.cmake $HOME
          make IN_HOST=1 WORKDIR=$(pwd) setup
          make IN_HOST=1 WORKDIR=$(pwd) bootloader
          make IN_HOST=1 WORKDIR=$(pwd) VERSION=${{ env.version }} firmware_initial
          make IN_HOST=1 WORKDIR=$(pwd) clean
          make IN_HOST=1 WORKDIR=$(pwd) VERSION=${{ env.version }} firmware_two_state_ksw_initial
          # Use the local release entry; its guard requires unchanged tracked files.
          # ToF has a separate build directory, so no clean is needed here.
          make IN_HOST=1 WORKDIR=$(pwd) VERSION=${{ env.version }} firmware_tof_release
          mv ./out/firmware.bin LexxHard-SensorControlBoard-Firmware-Initial-${{ github.ref_name }}.bin
          mv ./out/zephyr.signed.confirmed.bin LexxHard-SensorControlBoard-Firmware-Update-${{ github.ref_name }}.bin
          mv ./out/firmware_two_state_ksw.bin LexxHard-SensorControlBoard-Firmware-Two-State-KeySwitch-Initial-${{ github.ref_name }}.bin
          mv ./out/zephyr_two_state_ksw.signed.confirmed.bin LexxHard-SensorControlBoard-Firmware-Two-State-KeySwitch-Update-${{ github.ref_name }}.bin
          # Do not publish unpadded signed.bin: CAN DFU needs a trailer to request a swap.
          mv ./out/firmware_tof_release.bin LexxHard-SensorControlBoard-Firmware-ToF-Initial-${{ github.ref_name }}.bin
          mv ./out/zephyr_tof_release.signed.confirmed.bin LexxHard-SensorControlBoard-Firmware-ToF-Update-${{ github.ref_name }}.bin
          mv ./out/zephyr_tof_release.test.bin LexxHard-SensorControlBoard-Firmware-ToF-DFU-Test-${{ github.ref_name }}.bin
          # Publish the manifest; recompute checksums under the release asset names.
          mv ./out/zephyr_tof_release.MANIFEST.txt LexxHard-SensorControlBoard-Firmware-ToF-MANIFEST-${{ github.ref_name }}.txt
          sha256sum LexxHard-SensorControlBoard-Firmware-*-${{ github.ref_name }}.bin > SHA256SUMS-${{ github.ref_name }}.txt
          cat SHA256SUMS-${{ github.ref_name }}.txt
          cat LexxHard-SensorControlBoard-Firmware-ToF-MANIFEST-${{ github.ref_name }}.txt
      # Create or reuse the release; explicitly mark suffixed tags as prereleases.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            LexxHard-SensorControlBoard-Firmware-Initial-${{ github.ref_name }}.bin
            LexxHard-SensorControlBoard-Firmware-Update-${{ github.ref_name }}.bin
            LexxHard-SensorControlBoard-Firmware-Two-State-KeySwitch-Initial-${{ github.ref_name }}.bin
            LexxHard-SensorControlBoard-Firmware-Two-State-KeySwitch-Update-${{ github.ref_name }}.bin
            LexxHard-SensorControlBoard-Firmware-ToF-Initial-${{ github.ref_name }}.bin
            LexxHard-SensorControlBoard-Firmware-ToF-Update-${{ github.ref_name }}.bin
            LexxHard-SensorControlBoard-Firmware-ToF-DFU-Test-${{ github.ref_name }}.bin
            LexxHard-SensorControlBoard-Firmware-ToF-MANIFEST-${{ github.ref_name }}.txt
            SHA256SUMS-${{ github.ref_name }}.txt
      - name: Notification
        uses: act10ns/slack@v1
        with:
          status: ${{ job.status }}
          steps: ${{ toJson(steps) }}
          channel: '#div-02-robotics-ci'
        if: always()
