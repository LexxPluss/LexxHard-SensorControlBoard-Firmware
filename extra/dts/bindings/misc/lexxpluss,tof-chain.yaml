description: |
  Control lines and timing for the daisy-chained ToF enable chain
  (distributed D flip-flop, one per carrier board, shared clock).

compatible: "lexxpluss,tof-chain"

include: base.yaml

properties:
  data-gpios:
    type: phandle-array
    required: true
    description: Enable data line; also chain position 1's enable directly.

  clock-gpios:
    type: phandle-array
    required: true
    description: Shared flip-flop clock propagating the enable pattern.

  data-settle-ms:
    type: int
    required: true
    description: |
      Wait after changing the data line level before the next clock edge.
      DS20001 provisional value; the line settles over seconds at the
      register end. Final value pending hardware documentation (Request B).

  sensor-boot-ms:
    type: int
    required: true
    description: |
      Wait after a position's enable rises before probing it. DS20001
      provisional value.

  cycle-period-ms:
    type: int
    required: true
    description: |
      Acquisition cycle period. UNRESOLVED in the cliff wire contract: there is
      no approved value yet, which is exactly why it is required here instead of
      defaulted in firmware. A provisional number in an overlay is visible in a
      diff and belongs to whoever owns the deployment; the same number inside a
      scheduler becomes the specification by being the only one anybody can find.

  health-period-ms:
    type: int
    required: true
    description: |
      Health frame period, on its own timer and independent of the acquisition
      path. Also unresolved in the contract; required for the same reason.
