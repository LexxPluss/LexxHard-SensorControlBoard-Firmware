description: |
  Control lines and timing for the daisy-chained ToF enable chain
  (distributed D flip-flop, one per carrier board, shared clock).

compatible: "lexxpluss,tof-chain"

include: base.yaml

properties:
  data-gpios:
    type: phandle-array
    required: true
    description: Enable data line; also chain position 1's enable directly.

  clock-gpios:
    type: phandle-array
    required: true
    description: Shared flip-flop clock propagating the enable pattern.

  data-settle-ms:
    type: int
    required: true
    description: |
      Wait after changing the data line level before the next clock edge.
      DS20001 provisional value; the line settles over seconds at the
      register end. Final value pending hardware documentation (Request B).

  sensor-boot-ms:
    type: int
    required: true
    description: |
      Wait after a position's enable rises before probing it. DS20001
      provisional value.

  cycle-period-ms:
    type: int
    required: true
    description: |
      Acquisition cycle period. UNRESOLVED in the cliff wire contract: there is
      no approved value yet, which is exactly why it is required here instead of
      defaulted in firmware. A provisional number in an overlay is visible in a
      diff and belongs to whoever owns the deployment; the same number inside a
      scheduler becomes the specification by being the only one anybody can find.

  health-period-ms:
    type: int
    required: true
    description: |
      Health frame period, on its own timer and independent of the acquisition
      path. Also unresolved in the contract; required for the same reason.

  stop-join-timeout-ms:
    type: int
    required: true
    description: |
      How long a caller waits for the acquisition thread to finish its cycle
      and exit before giving up. On a timeout commissioning refuses to run and
      nothing is killed, so this value decides how patient that refusal is --
      a deployment decision, not a scheduler's, which is why it is required
      here and has no firmware default. It must exceed one cycle period plus
      the worst-case blocking time of a single sensor read.

  acq-stack-size:
    type: int
    required: true
    description: |
      Stack for the acquisition thread. It calls into the vendor ULD, whose
      depth is not ours to predict, so the value is provisional until a
      watermark has been measured on hardware -- and required, so that the
      provisional number is one somebody wrote down.

  acq-thread-priority:
    type: int
    required: true
    description: |
      Zephyr priority for the acquisition thread. Every value is legal,
      including 0, so nothing can range-check this; being required is the only
      guarantee that it was chosen rather than inherited.
