description: |
  Pinctrl anchor for the ToF I2C diagnostic shell (TOF_I2C_DIAG builds only).
  Carries the same pin groups as the i2c2 controller so tof_diag can hand
  PF0/PF1 back to the I2C2 alternate function after a bit-bang session.

compatible: "lexxpluss,tof-diag-pinctrl"

include: pinctrl-device.yaml
