# WHAT THIS REMOVES AND WHY, stated plainly because it is a change about what the image CONTAINS
# rather than about how it behaves.
#
# The ToF integration image binds the real grid adapter, and that alone cost +7,748 B: it reached
# 258,568 B signed against the 261,712 B ceiling with 3,144 B spare, and the grid publisher, the
# commissioning downlink worker, the runtime monitoring and the watchdog feeder were all still
# unwired. Removing the SD/FAT filesystem stack frees 20,052 B.
#
# WHAT IS LOST: the FAT filesystem and its `fs` shell commands, and with them any ability for an
# operator to browse or write files on this image. That is a real loss and it is the trade this
# fragment makes.
#
# WHAT IS NOT: nothing in the application calls the filesystem API -- fs_open, fs_mount, fs_read and
# the rest appear nowhere in lexxpluss_apps/src. Firmware update and the L7 device-firmware blob
# both go through flash_area_*, which is the Flash Map and not FAT, so both are untouched. MCUboot,
# the signing key, the confirmed-image generation and the partition layout are all left exactly as
# prj.conf sets them.
#
# APPLIED BY ONE BUILD, AND NOT IN prj.conf. Every other image -- product firmware, the chain build,
# the cliff build, the auto-commission build -- keeps the filesystem it has today. An image that
# does not need to be slim has no reason to lose a feature.
CONFIG_FILE_SYSTEM=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_FILE_SYSTEM_SHELL=n

# The SD disk exists only to be mounted by the filesystem above. Left enabled it is a driver with
# no consumer, which is bytes for nothing -- but it is listed separately because it is a SECOND
# removal and not a consequence of the first.
CONFIG_DISK_ACCESS=n
CONFIG_DISK_DRIVER_SDMMC=n
