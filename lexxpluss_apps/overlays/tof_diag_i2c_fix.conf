# DEV ONLY, added only when TOF_DIAG_I2C_FIX is set. See patches/zephyr/0004.
#
# The two corrections the 2026-09-23 measurement calls for: the final reload segment ends in TC,
# and the event handler syncs the peripheral before returning. Off everywhere else, so an image
# built without this flag is byte for byte the one that reproduced the hang.
CONFIG_I2C_STM32_LEXX_FINAL_RELOAD=y
