#
# WHAT THIS IS FOR. The Dasher default -- the ToF chain, the Package runtime and the LCS host in one
# image, LED strips and PGV out -- does not fit the 256 KiB slot on the production Newlib base. The
# measured trail on e5a75d4d: with only the first eight symbols below, the link overflows FLASH by
# 308 B; adding CONFIG_SHELL_HELP=n links but leaves the raw image 212 B over the signable payload;
# the full set signs at 258,408 B with 3,304 B spare against the 261,712 B ceiling. That margin is
# 1.26% -- a new log string or one re-enabled symbol here breaks the link again, and the next
# feature does not fit without picolibc (AMRSW-2887 PR #132) or a feature coming out.
#
# THE SHELL COMMANDS THAT MATTER STAY, AND THAT IS THE SELECTION RULE. What goes is convenience:
# history, tab completion, wildcards, colours, statistics, resize, help text, line-editing metakeys
# and VT100 cursor handling, the `device` and `clear`/`shell` command groups. What stays is every
# command a procedure depends on -- `kernel reboot` (CAN DFU flow), `devmem` (E-stop input decode),
# `lcs stat`, the ToF command groups -- plus the shell log backend, which is how Zephyr logs reach
# the host journal. CONFIG_BOOT_BANNER is deliberately kept: it costs 48 B and is the journal's
# reboot marker, which is how the 2026-11-04 reset loop was counted.
#
# RELATION TO AMRSW-2887. The first eight symbols duplicate PR #131 (CONFIG_SPI_STM32_DMA) and
# PR #133 (the shell conveniences); when those land they make these lines redundant but NOT this
# file -- the five symbols after them go beyond #133, so the file stays until the margin comes from
# somewhere real (picolibc). The SD/filesystem removal is inherited through tof_integration_slim.conf
# and not restated here.
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_STATS=n
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SPI_STM32_DMA=n

# Added for the LCS merge, 2026-11-09: the lines above no longer fit the image on their own.
CONFIG_SHELL_HELP=n
CONFIG_DEVICE_SHELL=n
CONFIG_SHELL_CMDS=n
CONFIG_SHELL_METAKEYS=n
CONFIG_SHELL_VT100_COMMANDS=n
