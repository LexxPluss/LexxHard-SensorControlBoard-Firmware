# WHAT THIS IS FOR. The chain and the Package runtime in one image overflow the 256 KiB slot at LINK
# time -- by 3,552 B on the production base, which is a link failure rather than a signed size, so no
# saving can be derived from it. With this fragment the configuration links and signs: 258,440 B with
# 3,272 B spare against the 261,712 B signed ceiling, measured on f3fc71e8 and recorded in
# allmemory/tof_package_sensing/freeze_20261104_l7_split/FREEZE.md. That margin is 1.25% of the
# ceiling, so a new log string or a re-enabled shell convenience can break the link again.
#
# WHY IT IS A FRAGMENT AND NOT A TREE CHANGE. These same symbols are in flight as AMRSW-2887: the SPI
# DMA line as PR #131 (removing CONFIG_SPI_STM32_DMA=y from lexxpluss_scb_defconfig) and the shell
# lines as PR #133 (adding them to prj.conf). Carrying them in a fragment is what lets this
# configuration link without waiting on four drafts. When #131 and #133 land, this fragment becomes
# redundant and should be deleted rather than kept in parallel -- they give no FURTHER headroom,
# because they set the identical symbols.
#
# ITS REACH IS NO LONGER NARROWER THAN THEIRS. features_dasher.cmake, the branch default, includes
# the Package configuration, so every image built with no FEATURES_FILE -- plain firmware, the
# two-state key switch variant, interlock -- is built with this fragment. A configuration that opts
# out of ToF (features_dasher_base.cmake, or an explicit features_tof_release.cmake) does not take
# it, which is the only distinction left.
#
# The SD/filesystem removal that AMRSW-2887 also covers is already inherited through
# overlays/tof_integration_slim.conf, so it is not restated here, and picolibc (PR #132) is NOT used
# by the measured build: it changes the C library for every image and needs its own regression.
#
# THE SHELL COMMANDS THEMSELVES STAY. Only the conveniences go -- history, tab completion, wildcards,
# colours, statistics and the resize command -- so field diagnostics over the SCB console still work.
CONFIG_SHELL_HISTORY=n
CONFIG_SHELL_TAB=n
CONFIG_SHELL_TAB_AUTOCOMPLETION=n
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_VT100_COLORS=n
CONFIG_SHELL_STATS=n
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SPI_STM32_DMA=n
