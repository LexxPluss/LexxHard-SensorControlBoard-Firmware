# Kconfig for every image built with ENABLE_TOF_L7_ULD, applied by lexxpluss_apps/CMakeLists.txt.
#
# main() calls tof_chain_controller::init() synchronously, and in an L7 image that runs
# tof_l7_runtime::bootstrap() -> verify_stored() -> verify() -> tc_sha256_update() -> compress() on the
# main stack. Measured from the final ELF of 3.6.0-151-g95eea619-DEV-NOFAT-L7-E2E-UNCONFIRMED, that one
# chain alone is 1,064 B (main 24, init 144, bootstrap 104, verify_stored 56, verify 560,
# tc_sha256_update 24, compress 152) against the 1,024 B default. On dasher2 the image hit the MPU
# stack guard on the first SHA block, halted, and was reset by the IWDG (RCC_CSR IWDGRSTF) -- see
# allmemory/hanging_object/l7_e2e_2026-09-22/attempt1_reverted.md. 2,048 B leaves about 980 B over
# that chain. Images without the L7 ULD never run it and keep the default.
CONFIG_MAIN_STACK_SIZE=2048

# The stored record's integrity check: SHA-256 over the 84 KiB payload and a CRC-32 over the header.
#
# SCOPED HERE RATHER THAN IN prj.conf, which is where the development images put them. There the
# argument for every other image being unaffected was that --gc-sections drops both when nothing
# calls them -- true, and an argument rather than a property. A fragment that only L7 builds apply
# makes it a property: an image without ENABLE_TOF_L7_ULD is configured exactly as it was, and
# nothing has to be re-verified after a change somewhere else makes a caller reachable.
#
# tinycrypt rather than mbedtls: one hash over 84 KiB at boot, and the smaller implementation is the
# one that has to fit in a slot whose tail margin is already the constraint that put the blob in
# flash to begin with.
CONFIG_CRC=y
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_SHA256=y
