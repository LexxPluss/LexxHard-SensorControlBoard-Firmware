# Kconfig for every image built with ENABLE_TOF_L7_ULD, applied by lexxpluss_apps/CMakeLists.txt.
#
# main() calls tof_chain_controller::init() synchronously, and in an L7 image that runs
# tof_l7_runtime::bootstrap() -> verify_stored() -> verify() -> tc_sha256_update() -> compress() on the
# main stack. Measured from the final ELF of 3.6.0-151-g95eea619-DEV-NOFAT-L7-E2E-UNCONFIRMED, that one
# chain alone is 1,064 B (main 24, init 144, bootstrap 104, verify_stored 56, verify 560,
# tc_sha256_update 24, compress 152) against the 1,024 B default. On dasher2 the image hit the MPU
# stack guard on the first SHA block, halted, and was reset by the IWDG (RCC_CSR IWDGRSTF) -- see
# allmemory/hanging_object/l7_e2e_2026-09-22/attempt1_reverted.md. 2,048 B leaves about 980 B over
# that chain. Images without the L7 ULD never run it and keep the default.
CONFIG_MAIN_STACK_SIZE=2048
