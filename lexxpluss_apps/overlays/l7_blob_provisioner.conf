# DEV ONLY: Kconfig fragment for the L7 blob provisioner image (ENABLE_L7_BLOB_PROVISIONER).
#
# The image confirms itself through boot_write_img_confirmed(), which needs the MCUboot image manager.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
#
# The SD-card FAT stack, which no application code calls, is removed to make room for the embedded
# 86,080-byte record: zero calls to fs_open/fs_mount/fs_read/fs_write/fs_close or <zephyr/fs/*>
# under lexxpluss_apps/src, and firmware_updater writes slot1 through flash_area_open, not a file.
# The SD hardware stays in the devicetree; only the software stack goes. Nothing in DFU or CAN uses it.
CONFIG_FILE_SYSTEM_SHELL=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_FS_FATFS_LFN=n
CONFIG_FILE_SYSTEM=n
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_DISK_ACCESS=n
#
# Interactive-shell conveniences, removed for the same reason: the image is otherwise 464 B over the
# slot. None of them is a command anything runs -- `resize`, glob expansion, shell statistics and the
# `device` listing. Kept on purpose: `kernel` (uptime, reboot cause triage) and `devmem` (reading the
# slot0 image_ok byte to see whether the image confirmed itself), plus `l7 provision`.
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_STATS=n
CONFIG_DEVICE_SHELL=n
