# Kconfig for every image built with ENABLE_LCS, applied by lexxpluss_apps/CMakeLists.txt.
#
# uart4 runs on the async UART API with DMA (see lcs_uart4_dma.overlay). The RX and TX buffers go to
# the non-cacheable section because the SCB image has CONFIG_DCACHE=y and DMA does not snoop the cache.
CONFIG_UART_ASYNC_API=y
CONFIG_NOCACHE_MEMORY=y
