#
# The two Kconfig symbols the ToF images need on top of prj.conf, which sets CONFIG_FLASH_MAP but
# neither of these. They are a FRAGMENT rather than two set() lines in features_tof_release.cmake
# because Zephyr collects CONFIG_* assignments only from CMake CACHE variables
# (zephyr/cmake/modules/kconfig.cmake reads the CACHE_VARIABLES property), so a plain set() in a
# feature file is read by nobody and the symbol silently keeps its default.
#
# CONFIG_IMG_MANAGER: boot_write_img_confirmed(), which is how the application self-confirms a
# test-booted image before the subsystem threads start.
# CONFIG_STREAM_FLASH: the streamed writes the L7 driver blob and the firmware update path use.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
