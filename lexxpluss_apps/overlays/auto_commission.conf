#
# The automatic-commissioning build's own Kconfig fragment. Applied by one Makefile target, stacked
# on the application's prj.conf, and by design absent from every other image.
#
# HARDWARE ONLY. The session token must be unguessable and uncorrelated between adjacent boots, so
# the only acceptable source is the STM32 RNG peripheral. Zephyr's fallbacks -- the timer-seeded
# generator, the xoshiro PRNG, the "test" generator -- would all satisfy the API and none of them
# would satisfy that, which is why tof_commission_entropy.cpp refuses at COMPILE time if one of them
# is what got selected. They are deliberately not set here, and setting them elsewhere breaks the
# build rather than quietly weakening the token.
CONFIG_ENTROPY_GENERATOR=y
CONFIG_ENTROPY_STM32_RNG=y
