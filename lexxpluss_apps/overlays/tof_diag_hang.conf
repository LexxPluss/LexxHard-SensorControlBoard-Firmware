# DEV ONLY, added only when TOF_DIAG_HANG is set. See src/tof_diag_i2c.hpp.
#
# Calls the application's forensics hooks on entry to the i2c2 event and error interrupts. The
# option is n everywhere else, so no released image contains any of this; the driver patch that
# provides it is patches/zephyr/0003-i2c-stm32-v2-isr-forensics.patch.
CONFIG_I2C_STM32_LEXX_ISR_FORENSICS=y
