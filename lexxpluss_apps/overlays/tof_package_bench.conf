# Kconfig for ENABLE_TOF_PACKAGE_BENCH images, applied by lexxpluss_apps/CMakeLists.txt.
#
# BENCH ONLY. No product configuration sets that flag, so nothing here reaches a product image.
#
# THE SHELL STACK, MEASURED RATHER THAN CHOSEN. Every pkg_tof command runs on the shell thread, and
# the first version of the driver put a VL53L7CX_Configuration -- 2,324 B on its own -- on that
# stack as a local in two different hooks. The default is 2,048 B, so a single object overran it
# before any call chain was counted. The large objects now live in .bss (src/tof_package_bench.cpp
# says why), and this is the accounting for the frames that remain.
#
# Worst case measured from the final ELF of the bench build by summing static frames
# (push/vpush/sub sp) along the call graph, with the indirect edges added by hand: the shell
# dispatches through a handler pointer, and the lifecycle calls every device operation through a
# hook pointer, so neither is visible to the disassembly.
#
# The deepest path through this driver is `pkg_tof up`, at 1,248 B:
#
#   shell_thread 0 + shell_signal_handle 24 + shell_process 196 + execute 156
#     + cmd_up 16 + lifecycle::bring_up 24
#     + hook_verified 0 + ensure_verified 8 + bootstrap_impl 100 + verify_stored 60
#     + blob verify 524 + tc_sha256_final 24 + compress 116
#
# Note where that goes: the deepest branch of a bring-up is the BLOB VERIFICATION, not the ULD. The
# same chain is what forced CONFIG_MAIN_STACK_SIZE up in overlays/tof_l7.conf, for the same reason,
# and it is 524 B in one frame. The firmware download branch is shallower at 604 B from the hook
# (vl53l7cx_init -> _vl53l7cx_send_offset_data, which is 420 B of locals by itself), and a readiness
# poll plus a grid fetch is 112 B.
#
# For comparison, the shell's own worst path in this image is 1,560 B and has nothing to do with
# this driver: wildcard processing reaches strstr's two_way_long_needle, which is 1,044 B in one
# frame. Every shell build carries it.
#
# So 2,048 B would in fact survive the measured paths, with 488 B spare. 4,096 B is set anyway, and
# the 2,048 B of .bss is affordable here for three reasons: the figures above are static frame sums
# and exclude the Cortex-M exception frame taken on the thread stack (up to 104 B once the FPU is
# in play), any indirect edge the hand-added list missed is invisible to them, and a bench image has
# 46 KB of slot headroom while the thing being measured is a device we have never driven on this
# bus. A product Package configuration must repeat this measurement against its own entry point --
# a thread with its own stack, not the shell -- rather than inherit this number.
CONFIG_SHELL_STACK_SIZE=4096

# boot_is_img_confirmed(), which the unattended revert needs before it arms anything: an
# unconditional timer in a CONFIRMED image is a reboot loop every ten minutes, not a protection. And
# a confirmed bench image is reachable by mistake rather than by design -- flashing the
# signed.confirmed.bin variant instead of the padded test image produces one -- so the check earns
# its cost.
#
# BOTH SYMBOLS, THOUGH ONLY THE QUERY IS USED. The first attempt here set CONFIG_MCUBOOT_IMG_MANAGER
# alone, on the reasoning that a bench image needs the query and not the image WRITE path. Kconfig
# does not allow that: subsys/dfu/Kconfig nests MCUBOOT_IMG_MANAGER inside `if IMG_MANAGER`, and
# IMG_MANAGER depends on STREAM_FLASH, so the query is unreachable without the write support behind
# it. The assignment was silently dropped and the link failed on boot_is_img_confirmed().
#
# So this image does carry the stream-flash helpers, as the chain targets do, and calls none of them:
# nothing in a bench image can confirm one, because there is no confirm command. The only outcomes
# are a revert on the deadman and a revert on any other reset.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
