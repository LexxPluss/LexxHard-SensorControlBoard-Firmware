# Bench-only shell stack. Keep the 2,324 B ULD objects in .bss.
# Static ELF frame sums: Package bring-up 1,248 B (blob verification), shell
# wildcard path 1,560 B; storage info/dump/sha 468/432/552 B.
# Reserve 4,096 B for exception frames (up to 104 B with FPU) and missed
# indirect edges. These are static estimates, not runtime watermarks; a
# product thread must be measured against its own entry point and ELF.
CONFIG_SHELL_STACK_SIZE=4096

# Check boot_is_img_confirmed() before arming: confirmed images must not reboot
# on this timer. Kconfig requires IMG_MANAGER and STREAM_FLASH for the query;
# this image carries the helpers but has no confirmation command.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y

# Reset getopt state between shell commands. Without SHELL_GETOPT, commands
# such as devmem dump work only once; reconnecting does not reset the shell.
# Limit the behavior change to the bench configuration.
CONFIG_SHELL_GETOPT=y
