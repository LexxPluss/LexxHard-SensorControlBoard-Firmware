# Kconfig for every image built with ENABLE_TOF_L7_ULD: the SD-card FAT stack comes out.
#
# WHY THIS IS THE DEFINITION OF AN L7 IMAGE RATHER THAN A SIZE TRICK. An L7 build carries 86,016
# bytes of vendored device firmware plus the ULD that downloads it, and with the filesystem stack in
# place it does not fit: measured at 264,096 B against the 261,712 B ceiling, over by 2,384. Without
# it the same image is 245,520 B with 16,192 B to spare. The filesystem is 18,576 B of that
# difference and nothing in this firmware calls it.
#
# VERIFIED BY INSPECTION, not assumed: there is no call to fs_open, fs_mount, fs_read, fs_write or
# fs_close and no include of <zephyr/fs/*> anywhere under lexxpluss_apps/src. The L7 blob lives in
# storage_partition and is read through the flash API; the updater writes slot1_partition through
# flash_area_open, not through a file. The FAT stack is reachable only from the Zephyr shell.
#
# The SD hardware stays on the board and in the devicetree. This removes the software stack, and it
# is non-safety by inspection: nothing in the cliff path, the ToF path, DFU or CAN touches it.
#
# Applied by lexxpluss_apps/CMakeLists.txt whenever the L7 ULD is built, rather than named on a
# build command, because an L7 image configured without it does not link -- and a capacity failure
# that depends on remembering a flag is a capacity failure waiting to be rediscovered.
CONFIG_FILE_SYSTEM_SHELL=n
CONFIG_FAT_FILESYSTEM_ELM=n
CONFIG_FS_FATFS_LFN=n
CONFIG_FILE_SYSTEM=n
CONFIG_DISK_DRIVER_SDMMC=n
CONFIG_DISK_ACCESS=n
