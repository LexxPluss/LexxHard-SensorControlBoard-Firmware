# Kconfig for ENABLE_TOF_PACKAGE_AUTO images that keep the unattended revert armed, applied by
# lexxpluss_apps/CMakeLists.txt. Not reached by any product configuration.
#
# BOTH SYMBOLS, THOUGH ONLY THE QUERY IS USED, and the reason is the same one
# overlays/tof_package_bench.conf gives: the deadman asks boot_is_img_confirmed() before it arms
# anything, because an unconditional timer in a CONFIRMED image is a reboot loop rather than a
# protection. Kconfig does not allow taking the query alone -- subsys/dfu/Kconfig nests
# MCUBOOT_IMG_MANAGER inside `if IMG_MANAGER`, which depends on STREAM_FLASH -- so the image
# carries the stream-flash helpers and calls none of them.
#
# This file exists separately from the bench's because the two images share this one requirement
# and nothing else: the bench overlay also resizes the shell stack and fixes a getopt bug, neither
# of which an image without a shell has.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
