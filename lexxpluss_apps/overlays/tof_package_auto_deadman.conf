# Auto deadman needs boot_is_img_confirmed() so confirmed images do not loop.
# Kconfig requires IMG_MANAGER and STREAM_FLASH for that query. Keep this
# separate from the bench overlay: auto has no pkg_tof command group and
# does not need the bench shell-stack/getopt changes. Ordinary shell remains.
CONFIG_STREAM_FLASH=y
CONFIG_IMG_MANAGER=y
