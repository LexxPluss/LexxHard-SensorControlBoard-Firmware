CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
# Recursive k_spin_lock() asserts instead of deadlocking, which is what makes
# test_the_lock_is_not_held_across_the_transaction a test rather than an assertion about the code.
CONFIG_ASSERT=y
CONFIG_SPIN_VALIDATE=y
# on_frame() is an ISR on the board, so the suite calls it from a real interrupt context with
# irq_offload() rather than asserting about one.
CONFIG_IRQ_OFFLOAD=y
