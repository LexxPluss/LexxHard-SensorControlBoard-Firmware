CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y
# SHA-256 for the payload's integrity check. tinycrypt rather than mbedtls: this is one hash over
# 84 KiB at boot, and the smaller implementation is the one that has to fit in a slot whose tail
#tail margin is already the constraint that put the blob in flash to begin with.
# CRC-32 for the header. Not implied by anything else here, and the production image will need the
# same symbol -- an omission that only shows up as a link error, which is the good direction.
CONFIG_CRC=y
CONFIG_TINYCRYPT=y
CONFIG_TINYCRYPT_SHA256=y
