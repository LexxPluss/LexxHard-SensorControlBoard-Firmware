CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y

# tof_cliff_can.cpp holds DEVICE_DT_GET(DT_NODELABEL(can2)), so the node has to exist for the file
# to compile at all. The loopback controller supplies one; nothing in this suite sends a frame, and
# the gate under test refuses every grid before a send is ever reached.
CONFIG_CAN=y
CONFIG_CAN_LOOPBACK=y
CONFIG_I2C=y
CONFIG_I2C_EMUL=y
