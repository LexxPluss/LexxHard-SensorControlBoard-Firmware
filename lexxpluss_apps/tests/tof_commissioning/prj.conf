CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y

# The GRID_L7=1 variant compiles the L7 port object, which resolves DT_NODELABEL(i2c2) at compile
# time. app.overlay supplies that node; the emul driver is what turns it into an actual device,
# without which the link fails on the node's device ordinal.
CONFIG_I2C=y
CONFIG_I2C_EMUL=y
