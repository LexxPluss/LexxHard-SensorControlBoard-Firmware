CONFIG_ZTEST=y
CONFIG_CPP=y
CONFIG_STD_CPP20=y
CONFIG_GLIBCXX_LIBCPP=y

# The REAL CAN stack, over native_sim's loopback controller. What is under test is the binding's use
# of the driver -- filter installation, which identifier it receives on, which it sends on, and that
# the send does not block -- so a fake CAN API would be testing the fake.
CONFIG_CAN=y
CONFIG_CAN_LOOPBACK=y
CONFIG_CAN_MAX_FILTER=8
