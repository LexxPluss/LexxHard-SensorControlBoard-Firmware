# The same tests with the target role compiled in. The board does not run it, so this is not a
# product configuration -- it exists because the rework's teardown has a target-aware half that is
# otherwise never compiled, and a fix guarded by CONFIG_I2C_TARGET that nobody builds is a fix
# nobody has checked.
CONFIG_ZTEST=y
CONFIG_I2C=y
CONFIG_I2C_TARGET=y
CONFIG_ASSERT=n
CONFIG_TEST=y
